<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem War Tiket Konser - Docker Swarm</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f0f4f8;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      width: 100%;
      padding: 24px;
      border: 1px solid #e2e8f0;
    }
    .badge-cluster {
      display: inline-block;
      background: #e2e8f0;
      color: #475569;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    h1 { font-size: 18px; color: #0f172a; margin-bottom: 4px; }
    p.subtitle { font-size: 13px; color: #64748b; margin-bottom: 16px; }
    
    .stock-box {
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    .stock-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; }
    .stock-value { font-size: 36px; font-weight: 800; color: #2563eb; line-height: 1.2; margin: 4px 0; }
    .stock-value.zero { color: #dc2626; }
    .served-by { font-size: 11px; color: #94a3b8; font-family: monospace; }

    .btn-buy {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn-buy:hover { background: #1d4ed8; }
    .btn-buy:active { transform: scale(0.99); }
    .btn-buy:disabled { background: #94a3b8; cursor: not-allowed; }

    .alert {
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      line-height: 1.4;
      animation: fadeIn 0.2s ease;
    }
    .alert-success { background: #dcfce7; border: 1px solid #86efac; color: #166534; }
    .alert-error { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }

    .reset-bar {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #64748b;
    }
    .btn-small {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      color: #334155;
      cursor: pointer;
    }
    .btn-small:hover { background: #e2e8f0; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge-cluster">Docker Swarm &bull; Routing Mesh</span>
    <h1>War Tiket Konser Musik</h1>
    <p class="subtitle">Simulasi Atomic Checkout & High Availability</p>

    <!-- LIVE STOCK DISPLAY -->
    <div class="stock-box">
      <div class="stock-title">Sisa Kuota Tiket Tersedia</div>
      <div id="stockValue" class="stock-value">...</div>
      <div id="workerHost" class="served-by">Worker Container: menghubungkan...</div>
    </div>

    <!-- TOMBOL BELI -->
    <button id="btnBuy" class="btn-buy" onclick="buyTicket()">
      <span>🎟️</span> Beli 1 Tiket Sekarang
    </button>

    <!-- KOTAK NOTIFIKASI HASIL TRANSAKSI -->
    <div id="alertBox" class="alert"></div>

    <!-- TOMBOL RESET UNTUK KEBUTUHAN DEMO -->
    <div class="reset-bar">
      <span>Kontrol Demo:</span>
      <div>
        <button class="btn-small" onclick="resetStock(5)">Reset 5 Tiket</button>
        <button class="btn-small" onclick="resetStock(1000)">Reset 1.000</button>
      </div>
    </div>
  </div>

  <script>
    async function updateStock() {
      try {
        const res = await fetch('/tickets');
        const data = await res.json();
        const stockEl = document.getElementById('stockValue');
        stockEl.textContent = Number(data.stock).toLocaleString('id-ID');
        if (data.stock <= 0) {
          stockEl.classList.add('zero');
        } else {
          stockEl.classList.remove('zero');
        }
        document.getElementById('workerHost').textContent = 'Node ID: ' + (data.servedBy || 'app');
      } catch (err) {
        document.getElementById('workerHost').textContent = 'Koneksi gagal: ' + err.message;
      }
    }

    async function buyTicket() {
      const btn = document.getElementById('btnBuy');
      const alertBox = document.getElementById('alertBox');
      btn.disabled = true;
      btn.textContent = 'Memproses Transaksi...';

      try {
        const start = performance.now();
        const res = await fetch('/tickets/buy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: 'web_user_' + Math.floor(Math.random() * 1000) })
        });
        const duration = Math.round(performance.now() - start);
        const data = await res.json();

        alertBox.style.display = 'block';

        if (res.status === 200 && data.success) {
          // KONDISI BERHASIL MENDAPATKAN TIKET
          alertBox.className = 'alert alert-success';
          alertBox.innerHTML = `
            <strong>✅ ${data.message}</strong><br>
            Sisa Stok: <strong>${data.remainingStock}</strong> &bull; Latensi: ${duration}ms<br>
            <small style="color: #15803d;">Diproses oleh Worker: <code>${data.servedBy}</code></small>
          `;
        } else {
          // KONDISI TIKET HABIS (STATUS 409 CONFLICT)
          alertBox.className = 'alert alert-error';
          alertBox.innerHTML = `
            <strong>🚫 ${data.message || 'War Tiket Selesai!'}</strong><br>
            Status: <strong>409 Conflict (Sold Out)</strong><br>
            Sisa Kuota: <strong>0</strong> &bull; Latensi: ${duration}ms<br>
            <small style="color: #b91c1c;">Diproses oleh Worker: <code>${data.servedBy || '-'}</code></small>
          `;
        }
      } catch (err) {
        alertBox.style.display = 'block';
        alertBox.className = 'alert alert-error';
        alertBox.innerHTML = `<strong>⚠️ Error Jaringan:</strong> ${err.message}`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>🎟️</span> Beli 1 Tiket Sekarang';
        updateStock();
      }
    }

    async function resetStock(count) {
      if (!confirm('Reset kuota tiket ke ' + count + '?')) return;
      try {
        await fetch('/tickets/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ stock: count })
        });
        document.getElementById('alertBox').style.display = 'none';
        updateStock();
      } catch (err) {
        alert('Gagal reset: ' + err.message);
      }
    }

    // Load initial stock on page open
    updateStock();
  </script>
</body>
</html>
