[databases]
wartiket_shard1 = host=db-shard1-primary port=5432 dbname=wartiket_db
wartiket_shard2 = host=db-shard2-primary port=5432 dbname=wartiket_db
wartiket_shard3 = host=db-shard3-primary port=5432 dbname=wartiket_db
wartiket_db     = host=db-shard1-primary port=5432 dbname=wartiket_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 30
reserve_pool_size = 10
ignore_startup_parameters = extra_float_digits,statement_timeout,application_name
admin_users = wartiket
stats_users = wartiket
