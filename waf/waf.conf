user nginx;
worker_processes 2;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    server_tokens off;

    log_format waf_audit '$remote_addr [$time_local] "$request" $status '
                         'rule="$waf_block_rule$waf_bad_bot" ua="$http_user_agent"';

    access_log /var/log/nginx/access.log waf_audit buffer=64k flush=5s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    # Docker Swarm internal DNS resolver
    resolver 127.0.0.11 valid=2s ipv6=off;

    # shortcut: rate ceilings tuned high for single-IP localhost k6 1000-VU benchmarks; lower to 30r/m per client IP in multi-client production
    limit_req_zone $binary_remote_addr zone=waf_general:10m rate=2500r/s;
    limit_req_zone $binary_remote_addr zone=waf_auth:10m rate=500r/s;
    limit_req_status 429;

    # Layer 7 WAF Inspection Maps (SQLi, XSS, LFI / Path Traversal)
    map $request_uri $waf_block_rule {
        default "";
        "~*(union(\+|%20|\s)+select|('|%27).*(--|%23|#)|\bor(\+|%20|\s)+1(\+|%20|\s)*=(\+|%20|\s)*1|drop(\+|%20|\s)+table|information_schema|sleep\s*\(|benchmark\s*\()" "SQLI";
        "~*(<script|%3cscript|javascript:|onerror=|onload=|document\.cookie)" "XSS";
        "~*(\.\./|%2e%2e|/etc/passwd|/proc/self)" "LFI";
    }

    # Malicious Vulnerability Scanner User-Agent Signatures
    map $http_user_agent $waf_bad_bot {
        default "";
        "~*(sqlmap|nikto|nmap|masscan|dirbuster|gobuster|hydra|acunetix|nessus)" "BAD-BOT";
    }

    # Layer 1 Perimeter WAF: ONLY ports 80 & 443 are exposed to the public
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name wartiketkonser.id www.wartiketkonser.id cdn.wartiketkonser.id cdn1.wartiketkonser.id cdn2.wartiketkonser.id localhost _;

        ssl_certificate /etc/nginx/ssl/wartiket.crt;
        ssl_certificate_key /etc/nginx/ssl/wartiket.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header X-WAF-Status "PROTECTED" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # WAF healthcheck endpoint
        location = /waf-health {
            return 200 '{"status":"UP","service":"wartiket-waf","exposedPorts":[80,443],"honeypot":"active"}';
        }

        # Honeypot Decoy Traps: divert scanner/attacker probes away from LB & App
        location ~* ^/(wp-admin|wp-login\.php|wp-content|phpmyadmin|pma|admin-backup|config\.php|backup\.sql|xmlrpc\.php|\.env|\.git) {
            set $honeypot_upstream "http://honeypot:8081";
            proxy_pass $honeypot_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Original-URI $request_uri;
            add_header X-WAF-Action "HONEYPOT-DIVERTED" always;
        }

        # Auth endpoints: WAF inspection + brute-force rate-limit zone
        location ~ ^/api/(auth/login|login)$ {
            if ($waf_block_rule != "") {
                add_header X-WAF-Action "BLOCKED" always;
                add_header X-WAF-Rule $waf_block_rule always;
                return 403 '{"blocked":true,"layer":"WAF","rule":"WAF_ATTACK_SIGNATURE","message":"Permintaan diblokir oleh Web Application Firewall."}';
            }
            if ($waf_bad_bot != "") {
                add_header X-WAF-Action "BLOCKED" always;
                add_header X-WAF-Rule "BAD-BOT" always;
                return 403 '{"blocked":true,"layer":"WAF","rule":"BAD-BOT","message":"Scanner otomatis diblokir oleh Web Application Firewall."}';
            }

            limit_req zone=waf_auth burst=500 nodelay;
            set $lb_upstream "http://nginx:80";
            proxy_pass $lb_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Validated traffic -> Layer 2 Nginx Load Balancer & CDN Edge
        location / {
            if ($waf_block_rule != "") {
                add_header X-WAF-Action "BLOCKED" always;
                add_header X-WAF-Rule $waf_block_rule always;
                return 403 '{"blocked":true,"layer":"WAF","rule":"WAF_ATTACK_SIGNATURE","message":"Permintaan diblokir oleh Web Application Firewall."}';
            }
            if ($waf_bad_bot != "") {
                add_header X-WAF-Action "BLOCKED" always;
                add_header X-WAF-Rule "BAD-BOT" always;
                return 403 '{"blocked":true,"layer":"WAF","rule":"BAD-BOT","message":"Scanner otomatis diblokir oleh Web Application Firewall."}';
            }

            limit_req zone=waf_general burst=1500 nodelay;
            set $lb_upstream "http://nginx:80";
            proxy_pass $lb_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
