user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream: $upstream_addr '
                    'response_time: ${upstream_response_time}s';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Docker Swarm internal DNS resolver with fast 2s TTL
    resolver 127.0.0.11 valid=2s ipv6=off;

    server {
        listen 80;
        listen 443 ssl;
        server_name wartiketkonser.id www.wartiketkonser.id localhost;

        ssl_certificate /etc/nginx/ssl/wartiket.crt;
        ssl_certificate_key /etc/nginx/ssl/wartiket.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            set $backend "http://app:3000";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Failover retries: transparently route to surviving workers if a container dies
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            add_header X-Upstream-Addr $upstream_addr always;
        }

        # Health endpoint for Nginx itself
        location /nginx-health {
            default_type application/json;
            return 200 '{"status":"UP","service":"nginx-load-balancer","domain":"wartiketkonser.id"}';
        }
    }
}
