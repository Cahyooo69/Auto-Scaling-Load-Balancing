user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream: $upstream_addr '
                    'response_time: ${upstream_response_time}s';

    access_log /var/log/nginx/access.log main buffer=64k flush=5s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Docker Swarm internal DNS resolver with fast 2s TTL
    resolver 127.0.0.11 valid=2s ipv6=off;

    # 1. HTTP Server Block: Healthchecks, API Proxy & Automatic Redirect to HTTPS
    server {
        listen 80;
        server_name wartiketkonser.id www.wartiketkonser.id localhost "";

        # Internal healthcheck endpoint for Docker healthcheck
        location /nginx-health {
            default_type application/json;
            return 200 '{"status":"UP","service":"nginx-load-balancer","domain":"wartiketkonser.id"}';
        }

        # Health endpoint for autoscaler container
        location /health {
            set $backend "http://app:3000";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Compatibility proxy for headless / automated load-test scripts targeting port 80
        location /api/ {
            set $backend "http://app:3000";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        location /tickets/ {
            set $backend "http://app:3000";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # Automatic redirect from HTTP (port 80) to HTTPS domain resmi https://wartiketkonser.id
        location / {
            return 301 https://wartiketkonser.id$request_uri;
        }
    }

    # 2. HTTPS Redirect: Alihkan https://localhost & https://127.0.0.1 langsung ke https://wartiketkonser.id/
    server {
        listen 443 ssl;
        server_name localhost 127.0.0.1;

        ssl_certificate /etc/nginx/ssl/wartiket.crt;
        ssl_certificate_key /etc/nginx/ssl/wartiket.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /nginx-health {
            default_type application/json;
            return 200 '{"status":"UP","service":"nginx-load-balancer","domain":"wartiketkonser.id"}';
        }

        location /api/ {
            set $backend "http://app:3000";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host wartiketkonser.id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            return 301 https://wartiketkonser.id$request_uri;
        }
    }

    # 3. HTTPS Server Block Utama: Domain Resmi https://wartiketkonser.id/
    server {
        listen 443 ssl default_server;
        server_name wartiketkonser.id www.wartiketkonser.id;

        ssl_certificate /etc/nginx/ssl/wartiket.crt;
        ssl_certificate_key /etc/nginx/ssl/wartiket.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS and Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;

        location / {
            set $backend "http://app:3000";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_connect_timeout 3s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            # Failover retries: transparently route to surviving workers if a container dies
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            add_header X-Upstream-Addr $upstream_addr always;
        }

        # Health endpoint for Nginx itself over HTTPS
        location /nginx-health {
            default_type application/json;
            return 200 '{"status":"UP","service":"nginx-load-balancer","domain":"wartiketkonser.id"}';
        }
    }
}
