user nginx;
worker_processes 2;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream: $upstream_addr '
                    'cache: $upstream_cache_status '
                    'response_time: ${upstream_response_time}s';

    access_log /var/log/nginx/access.log main buffer=64k flush=5s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Pull-through CDN Edge Cache backed by MinIO Object Storage (S3)
    proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn_cache:20m max_size=256m inactive=60m use_temp_path=off;

    # Docker Swarm internal DNS resolver with fast 2s TTL
    resolver 127.0.0.11 valid=2s ipv6=off;

    # Dedicated CDN Subdomain Edge Server (cdn.wartiketkonser.id / cdn1 / cdn2)
    server {
        listen 80;
        server_name cdn.wartiketkonser.id cdn1.wartiketkonser.id cdn2.wartiketkonser.id;

        location / {
            set $minio_origin "http://minio:9000";
            proxy_pass $minio_origin/wartiket-assets$uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host minio:9000;

            proxy_cache cdn_cache;
            proxy_cache_valid 200 30m;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;

            add_header X-CDN-Cache $upstream_cache_status always;
            add_header X-CDN-Origin "minio-s3" always;
            add_header Cache-Control "public, max-age=1800" always;
        }
    }

    # Internal Load Balancer + Path-Based CDN Edge (/cdn/ and static offloading)
    server {
        listen 80 default_server;
        server_name wartiketkonser.id www.wartiketkonser.id localhost _;

        # Explicit CDN path -> pull-through cache from MinIO Object Storage
        location ~ ^/cdn/(.+)$ {
            set $minio_origin "http://minio:9000";
            set $asset_path $1;
            proxy_pass $minio_origin/wartiket-assets/$asset_path;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host minio:9000;

            proxy_cache cdn_cache;
            proxy_cache_key "$scheme$host/cdn/$asset_path";
            proxy_cache_valid 200 30m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;

            # Transparent fallback to backend static dir if MinIO is cold or down
            proxy_intercept_errors on;
            error_page 404 502 503 504 = @cdn_fallback;

            add_header X-CDN-Cache $upstream_cache_status always;
            add_header X-CDN-Origin "minio-s3" always;
            add_header Cache-Control "public, max-age=1800" always;
        }

        location @cdn_fallback {
            set $backend "http://app:3000";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            add_header X-CDN-Cache "FALLBACK" always;
        }

        # Static assets (img, css, js) offloaded to MinIO + CDN Edge Cache with backend fallback
        location ~* ^/(img|css|js)/(.+)$ {
            set $minio_origin "http://minio:9000";
            proxy_pass $minio_origin/wartiket-assets$uri;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host minio:9000;

            proxy_cache cdn_cache;
            proxy_cache_key "$scheme$host$uri";
            proxy_cache_valid 200 30m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;

            proxy_intercept_errors on;
            error_page 404 502 503 504 = @backend;

            add_header X-CDN-Cache $upstream_cache_status always;
            add_header X-CDN-Origin "minio-s3" always;
            add_header Cache-Control "public, max-age=1800" always;
        }

        # Dynamic application & API traffic -> Swarm App Worker Pool
        location / {
            set $backend "http://app:3000";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Failover retries: transparently route to surviving workers if a container dies
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            add_header X-Upstream-Addr $upstream_addr always;
        }

        location @backend {
            set $backend "http://app:3000";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            add_header X-Upstream-Addr $upstream_addr always;
        }

        # Health endpoint for Nginx Load Balancer itself
        location /nginx-health {
            default_type application/json;
            return 200 '{"status":"UP","service":"nginx-load-balancer-cdn","domain":"wartiketkonser.id"}';
        }
    }
}
