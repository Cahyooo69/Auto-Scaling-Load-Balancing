global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'cadvisor'
    dns_sd_configs:
      - names: ['tasks.cadvisor']
        type: A
        port: 8080

  - job_name: 'node-exporter'
    dns_sd_configs:
      - names: ['tasks.node-exporter']
        type: A
        port: 9100

  - job_name: 'honeypot'
    dns_sd_configs:
      - names: ['tasks.wartiket_honeypot']
        type: A
        port: 8081

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
