services:
  # Redis: In-memory store for atomic ticket locking & inventory management (with AOF persistence)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60 1", "--dir", "/data"]
    volumes:
      - redis-data:/data
    networks:
      - wartiket-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 2s
        window: 10s
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  # Relational Database: PostgreSQL 16 (ACID storage for users, concerts, seats, transactions)
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=128MB"]
    environment:
      - POSTGRES_DB=wartiket_db
      - POSTGRES_USER=wartiket
      - POSTGRES_PASSWORD=wartiket_secret
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./app/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - wartiket-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 2s
        window: 10s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wartiket -d wartiket_db"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  # Node.js API Worker Service (3 initial replicas -> up to 8 replicas on scale)
  app:
    image: wartiket-app:latest
    restart: unless-stopped
    build:
      context: ./app
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=wartiket_db
      - DB_USER=wartiket
      - DB_PASSWORD=wartiket_secret
      - DB_POOL_MAX=20
      - QUEUE_MAX_ACTIVE=200
      - INITIAL_STOCK=1000
      - JWT_SECRET=wartiket-cloud-jwt-secret-2026
    networks:
      - wartiket-net
    deploy:
      replicas: 3
      restart_policy:
        condition: any
        delay: 2s
        window: 10s
      update_config:
        parallelism: 2
        delay: 5s
        order: start-first
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  # Nginx: Reverse Proxy & Load Balancer (1 replica agar port 80/443 tidak bentrok saat docker-compose up)
  nginx:
    image: wartiket-nginx:latest
    restart: unless-stopped
    build:
      context: ./nginx
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    networks:
      - wartiket-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 2s
        window: 10s
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s

  # Auto-Scaler: Monitors Compose/Swarm CPU quota, latency & traffic bursts -> scales app (3..8)
  autoscaler:
    image: wartiket-app:latest
    restart: unless-stopped
    command: ["node", "autoscaler.js"]
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      nginx:
        condition: service_healthy
    environment:
      - MIN_REPLICAS=3
      - MAX_REPLICAS=8
      - SCALE_STEP=2
      - SCALE_UP_CPU=40
      - SCALE_DOWN_CPU=15
      - SCALE_UP_LATENCY_MS=120
      - HEALTH_URL=http://nginx/health
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - COMPOSE_PROJECT=auto-scaling-load-balancing-main
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - wartiket-net
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.10'
          memory: 64M

networks:
  wartiket-net:
    driver: overlay
    attachable: true

volumes:
  redis-data:
  db-data:
